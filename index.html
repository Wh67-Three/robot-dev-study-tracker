<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>机器人开发工具学习进度</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --panel: #ffffff;
      --border: #d9e0e7;
      --text: #18232f;
      --muted: #64748b;
      --accent: #0f766e;
      --accent-soft: #e6f4f1;
      --warning: #b45309;
      --danger: #b91c1c;
      --done: #15803d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }

    button, input, textarea, select { font: inherit; }

    .app-shell {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 56px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 8px 24px rgba(24, 35, 47, 0.08);
      backdrop-filter: blur(10px);
    }

    .title-block h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0;
    }

    .title-block p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .summary {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .metric {
      min-width: 96px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
    }

    .metric strong {
      display: block;
      font-size: 18px;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin: 18px 0;
    }

    .toolbar select,
    .toolbar input {
      height: 38px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel);
      color: var(--text);
    }

    .toolbar input[type="search"] {
      min-width: 220px;
      flex: 1;
    }

    .icon-button {
      height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
    }

    .icon-button:hover { border-color: var(--accent); color: var(--accent); }

    .icon-button svg { width: 16px; height: 16px; }

    .week-section {
      margin-top: 24px;
    }

    .week-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      padding: 12px 14px;
      border-left: 4px solid var(--accent);
      border-radius: 6px;
      background: var(--accent-soft);
    }

    .week-heading h2 {
      margin: 0;
      font-size: 17px;
    }

    .week-heading p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .day-card {
      margin-bottom: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      overflow: hidden;
    }

    .day-card.next-day { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

    .day-card.is-complete { border-color: #9fd6ae; }

    .day-summary {
      display: grid;
      grid-template-columns: 132px 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 12px 14px;
      cursor: pointer;
      user-select: none;
    }

    .day-date {
      display: flex;
      flex-direction: column;
    }

    .day-date strong { font-size: 15px; }
    .day-date span { color: var(--muted); font-size: 12px; }

    .day-title {
      min-width: 0;
    }

    .day-title strong {
      display: block;
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .day-title span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
    }

    .day-progress {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .mini-progress {
      width: 76px;
      height: 6px;
      border-radius: 999px;
      background: #e2e8f0;
      overflow: hidden;
    }

    .mini-progress > span {
      display: block;
      height: 100%;
      background: var(--accent);
      transition: width 180ms ease;
    }

    .next-badge {
      display: inline-block;
      margin-left: 8px;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
    }

    .day-body {
      display: none;
      padding: 0 14px 16px;
      border-top: 1px solid var(--border);
    }

    .day-card.open .day-body { display: block; }

    .task-block {
      margin-top: 14px;
    }

    .task-block h3 {
      margin: 0 0 8px;
      font-size: 13px;
      color: #334155;
      letter-spacing: 0;
    }

    .check-row {
      display: grid;
      grid-template-columns: 24px 1fr;
      gap: 8px;
      align-items: start;
      margin: 7px 0;
    }

    .check-row input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      accent-color: var(--accent);
    }

    .check-row label {
      cursor: pointer;
    }

    .check-row label.done {
      color: var(--muted);
      text-decoration: line-through;
    }

    .question {
      padding: 10px;
      margin: 8px 0;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #f8fafc;
    }

    .question-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .question-text {
      margin: 0;
      font-weight: 600;
    }

    .question textarea {
      width: 100%;
      min-height: 72px;
      resize: vertical;
      margin-top: 8px;
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      line-height: 1.55;
    }

    .question-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .answer-state {
      display: inline-block;
      min-width: 52px;
      text-align: center;
      padding: 3px 7px;
      border-radius: 999px;
      background: #e2e8f0;
      color: #475569;
      font-size: 11px;
    }

    .answer-state.answered {
      background: #dcfce7;
      color: var(--done);
    }

    .empty-state {
      padding: 60px 20px;
      text-align: center;
      color: var(--muted);
    }

    .hidden { display: none !important; }

        .review-toggle {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--warning);
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }

    .review-toggle input {
      width: 15px;
      height: 15px;
      accent-color: var(--warning);
    }

    .count-badge {
      min-width: 20px;
      padding: 1px 6px;
      border-radius: 999px;
      background: var(--warning);
      color: #fff;
      font-size: 11px;
      text-align: center;
    }

    .review-panel,
    .heatmap-panel,
    .skill-panel {
      margin: 0 0 18px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
    }

    .review-panel { border-color: #fcd34d; background: #fffbeb; }
    .review-panel h2, .heatmap-panel h2 { margin: 0 0 10px; font-size: 15px; }
    .review-list { display: grid; gap: 8px; }
    .review-item { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid #f1e5b8; }
    .review-item:last-child { border-bottom: 0; }
    .review-item p { margin: 0; }
    .review-item small { color: var(--muted); }
    .review-item button { height: 30px; padding: 0 10px; border: 1px solid #f59e0b; border-radius: 6px; background: #fff; color: #92400e; cursor: pointer; white-space: nowrap; }
    .heatmap { display: grid; grid-template-columns: repeat(auto-fill, minmax(20px, 1fr)); gap: 5px; }
    .heat-cell { position: relative; aspect-ratio: 1; min-height: 20px; border: 0; border-radius: 3px; background: #e2e8f0; cursor: pointer; }
    .heat-cell.low { background: #fef08a; }
    .heat-cell.mid { background: #f59e0b; }
    .heat-cell.full { background: #15803d; }
    .heat-cell[title]:hover { outline: 2px solid var(--accent); outline-offset: 1px; }
    .skill-panel summary { cursor: pointer; font-weight: 650; color: #334155; }
    .skill-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; margin-top: 10px; }
    .skill-item { display: grid; grid-template-columns: 20px 1fr; gap: 8px; align-items: start; padding: 8px; border: 1px solid var(--border); border-radius: 6px; background: #f8fafc; }
    .skill-item input { width: 16px; height: 16px; margin-top: 2px; accent-color: var(--accent); }
    .skill-item label { cursor: pointer; }
    .time-row { display: flex; align-items: center; gap: 10px; }
    .time-row input[type="number"] { width: 110px; height: 38px; padding: 0 10px; border: 1px solid var(--border); border-radius: 6px; }
    .time-row span { color: var(--muted); font-size: 13px; }
    .note-box { width: 100%; min-height: 84px; resize: vertical; padding: 9px 10px; border: 1px solid var(--border); border-radius: 6px; background: #fff; color: var(--text); line-height: 1.55; }
    .skill-progress { margin: 0 0 10px; color: var(--muted); font-size: 13px; }
    .video-task-content { min-width: 0; }
    .video-task-content > label { display: block; }
    .video-links { display: grid; gap: 6px; margin-top: 8px; }
    .video-link {
      display: grid;
      grid-template-columns: auto auto minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      padding: 7px 9px;
      border: 1px solid #b7cdd6;
      border-radius: 6px;
      background: #eef7f9;
      color: #155e75;
      text-decoration: none;
      font-size: 12px;
      line-height: 1.4;
    }
    .video-link:hover { border-color: var(--accent); background: #dff2f5; }
    .video-link-course { font-weight: 650; white-space: nowrap; }
    .video-link-range { color: var(--accent); font-weight: 600; white-space: nowrap; }
    .video-link-topic { min-width: 0; color: #334155; }
    .video-link-open { white-space: nowrap; color: var(--accent); font-weight: 600; }
@media (max-width: 760px) {
      .app-shell { width: min(100% - 20px, 1120px); padding-top: 10px; }
      .topbar { position: static; align-items: stretch; flex-direction: column; }
      .summary { justify-content: stretch; }
      .metric { flex: 1; }
      .toolbar input[type="search"] { min-width: 100%; order: -1; }
      .day-summary { grid-template-columns: 100px 1fr; }
      .day-progress { display: none; }
      .week-heading { align-items: flex-start; flex-direction: column; }
      .video-link { grid-template-columns: 1fr; }
      .video-link-course, .video-link-range, .video-link-topic, .video-link-open { white-space: normal; }
    }
  </style>
</head>

        <h1>机器人开发工具学习进度</h1>
        <p>9/8-10/17，按日标记任务、目标、动作和问题回答</p>

    <div class="toolbar">

        <option value="6">第六周</option>

      <button class="icon-button" id="todayButton" type="button">

      </button>
      <button class="icon-button" id="prevDayButton" type="button">

        前一天
      </button>
      <button class="icon-button" id="nextDayButton" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
        下一天
      </button>
      <button class="icon-button" id="expandAll" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="m7 14 5-5 5 5"></path>
        </svg>
        全部展开
      </button>
      <button class="icon-button" id="collapseAll" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="m7 10 5 5 5-5"></path>
        </svg>
        全部收起
      </button>
      <button class="icon-button" id="exportButton" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 21h14"></path>
        </svg>
        导出
      </button>
      <button class="icon-button" id="importButton" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M12 15V3"></path><path d="m7 8 5-5 5 5"></path><path d="M5 21h14"></path>
        </svg>
        导入
      </button>
      <button class="icon-button" id="resetButton" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path>
        </svg>
        重置
      </button>
      <input class="hidden" id="importFile" type="file" accept="application/json">
    </div>

    <section class="review-panel hidden" id="reviewPanel" aria-live="polite"></section>
    <section class="heatmap-panel" id="heatmapPanel"></section>
    <details class="skill-panel" id="skillPanel">
      <summary>C++ 核心能力检查</summary>
      <p class="skill-progress" id="skillProgress">0/12 已掌握</p>
      <div class="skill-grid" id="skillList"></div>
    </details>

    <section id="planList" aria-live="polite"></section>
  </main>

    function loadState() {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
      return plan.map(item => {
        const old = saved[item.date] || {};
        return {
          ...item,
          videoMeta: videoMetaByDate[item.date] || [],
          open: typeof old.open === "boolean" ? old.open : item.date === getTodayDateKey(),
          videoDone: !!old.videoDone,
          goalDone: !!old.goalDone,
          actualMinutes: Number(old.actualMinutes) || 0,
          notes: old.notes || "",
          actionsDone: item.actions.map((_, index) => !!(old.actionsDone && old.actionsDone[index])),
          answers: item.questions.map((question, index) => ({
            text: question,
            answer: old.answers && old.answers[index] ? old.answers[index].answer : "",
            answered: old.answers && old.answers[index] ? !!old.answers[index].answered : false,
            review: old.answers && old.answers[index] ? !!old.answers[index].review : false
          }))
        };
      });
    }

    function persist() {
      const snapshot = {};
      state.forEach(item => {
        snapshot[item.date] = {
          open: item.open,
          videoDone: item.videoDone,
          goalDone: item.goalDone,
          actualMinutes: item.actualMinutes,
          notes: item.notes,
          actionsDone: item.actionsDone,
          answers: item.answers.map(answer => ({ answer: answer.answer, answered: answer.answered, review: answer.review }))
        };
      });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(snapshot));
    }

    function render() {
      const keyword = searchInput.value.trim().toLowerCase();
      const week = weekFilter.value;
      const status = statusFilter.value;
      const filtered = state.filter(item => {
        if (week !== "all" && String(item.week) !== week) return false;
        if (status !== "all" && getStatus(item) !== status) return false;
        if (!keyword) return true;
        const videoMetaText = (item.videoMeta || []).map(meta => `${videoCourses[meta.course].name} ${meta.topic}`).join(" ");
        const haystack = [item.date, item.video, videoMetaText, item.goal, ...item.actions, ...item.questions]
          .join(" ")
          .toLowerCase();
        return haystack.includes(keyword);
      });

      list.innerHTML = "";
      if (!filtered.length) {
        list.innerHTML = '<div class="empty-state">没有符合当前条件的学习任务</div>';
      }

      let currentWeek = null;
      filtered.forEach(item => {
        if (item.week !== currentWeek) {
          currentWeek = item.week;
          list.appendChild(createWeekHeader(item));
        }
        list.appendChild(createDayCard(item));
      });
      renderSummary();
      renderReviewPanel();
      renderHeatmap();
      renderSkills();
    }

    function createWeekHeader(item) {
      const section = document.createElement("section");
      section.className = "week-section";
      section.innerHTML = `
        <div class="week-heading">
          <h2>${item.weekName || `第${item.week}周`}</h2>
          <p>${item.weekGoal || ""}</p>
        </div>`;
      return section;
    }

    function createDayCard(item) {

      card.className = "day-card" + (item.open ? " open" : "") + (isComplete(item) ? " is-complete" : "") + (isNextDay(item) ? " next-day" : "");
      card.dataset.date = item.date;

      const total = 2 + item.actions.length + item.questions.length;
      const done = Number(item.videoDone) + Number(item.goalDone) +
        item.actionsDone.filter(Boolean).length +
        item.answers.filter(answer => answer.answered || answer.answer.trim()).length;
      const percent = Math.round((done / total) * 100);

      card.innerHTML = `
        <div class="day-summary">
          <div class="day-date">
            <strong>${item.date}</strong>
            <span>${item.day} · ${item.hours}</span>
          </div>
          <div class="day-title">

            <span>${item.goal}</span>
          </div>
          <div class="day-progress">
            <span>${done}/${total}</span>
            <div class="mini-progress"><span style="width:${percent}%"></span></div>
          </div>
        </div>
        <div class="day-body">
          <div class="task-block">
            <h3>视频任务</h3>
            <div class="check-row video-row">
              <input type="checkbox" data-type="video" data-date="${item.date}" ${item.videoDone ? "checked" : ""}>
              <div class="video-task-content">
                <label class="${item.videoDone ? "done" : ""}">${item.video}</label>
                ${renderVideoLinks(item)}
              </div>
            </div>
          </div>
          <div class="task-block">
            <h3>实际学习时长</h3>
            <div class="time-row">
              <input type="number" data-type="minutes" data-date="${item.date}" value="${item.actualMinutes || ""}" placeholder="0" min="0" step="5">
              <span>分钟 / 计划 ${plannedMinutes(item.hours)} 分钟</span>
            </div>
          </div>
          <div class="task-block">
            <h3>学习目标完成情况</h3>
            <div class="check-row">
              <input type="checkbox" data-type="goal" data-date="${item.date}" ${item.goalDone ? "checked" : ""}>
              <label class="${item.goalDone ? "done" : ""}">${item.goal}</label>
            </div>
          </div>
          <div class="task-block">
            <h3>当日动作完成情况</h3>
            ${item.actions.map((action, index) => `
              <div class="check-row">
                <input type="checkbox" data-type="action" data-date="${item.date}" data-index="${index}" ${item.actionsDone[index] ? "checked" : ""}>
                <label class="${item.actionsDone[index] ? "done" : ""}">${action}</label>
              </div>`).join("")}
          </div>
          <div class="task-block">
            <h3>必答问题</h3>
            ${item.answers.map((answer, index) => `
              <div class="question">
                <div class="question-top">
                  <p class="question-text">${index + 1}. ${answer.text}</p>
                  <div class="question-meta">
                    <span class="answer-state ${answer.answered || answer.answer.trim() ? "answered" : ""}">${answer.answered || answer.answer.trim() ? "已回答" : "未回答"}</span>
                    <input type="checkbox" data-type="answered" data-date="${item.date}" data-index="${index}" ${answer.answered ? "checked" : ""} aria-label="标记已回答">
                    <label class="review-toggle"><input type="checkbox" data-type="review" data-date="${item.date}" data-index="${index}" ${answer.review ? "checked" : ""} aria-label="加入复习队列">复习</label>
                  </div>
                </div>
                <textarea data-type="answer" data-date="${item.date}" data-index="${index}" placeholder="在这里写下你的回答">${escapeHtml(answer.answer)}</textarea>
              </div>`).join("")}
          </div>
          <div class="task-block">
            <h3>当日复盘</h3>
            <textarea class="note-box" data-type="notes" data-date="${item.date}" placeholder="记录卡点、收获、明天要改的三件事">${escapeHtml(item.notes)}</textarea>
          </div>
        </div>`;

      card.querySelector(".day-summary").addEventListener("click", () => {
        item.open = !item.open;
        persist();
        card.classList.toggle("open", item.open);
      });

      card.querySelectorAll("input[type='checkbox']").forEach(input => {
        input.addEventListener("change", event => {
          event.stopPropagation();
          const type = input.dataset.type;
          const index = Number(input.dataset.index);
          if (type === "video") item.videoDone = input.checked;
          if (type === "goal") item.goalDone = input.checked;
          if (type === "action") item.actionsDone[index] = input.checked;
          if (type === "review") item.answers[index].review = input.checked;
          if (type === "answered") {
            item.answers[index].answered = input.checked;
            const answerState = card.querySelectorAll(".answer-state")[index];
            answerState.textContent = input.checked || item.answers[index].answer.trim() ? "已回答" : "未回答";
            answerState.classList.toggle("answered", input.checked || !!item.answers[index].answer.trim());
          }
          persist();
          render();
        });

      card.querySelectorAll("textarea").forEach(textarea => {
        textarea.addEventListener("input", event => {
          event.stopPropagation();
          if (textarea.dataset.type === "notes") {
            item.notes = textarea.value;
            persist();
            return;
          }
          const index = Number(textarea.dataset.index);
          item.answers[index].answer = textarea.value;
          const checkbox = card.querySelector(`input[data-type="answered"][data-index="${index}"]`);
          const answerState = card.querySelectorAll(".answer-state")[index];
          const hasText = !!textarea.value.trim();
          if (hasText) {
            item.answers[index].answered = true;
            if (checkbox) checkbox.checked = true;
          } else if (checkbox) {
            item.answers[index].answered = checkbox.checked;
          }
          if (answerState) {
            answerState.textContent = item.answers[index].answered || hasText ? "已回答" : "未回答";
            answerState.classList.toggle("answered", item.answers[index].answered || hasText);
          }
          persist();
          renderSummary();
        });
      });

      card.querySelectorAll('input[type="number"][data-type="minutes"]').forEach(input => {
        input.addEventListener("change", event => {
          event.stopPropagation();
          item.actualMinutes = Math.max(0, Number(input.value) || 0);
          persist();
          renderSummary();
          renderHeatmap();
        });
      });

      return card;

        function renderVideoLinks(item) {
      const metas = item.videoMeta || [];
      return `<div class="video-links">${metas.map(meta => {
        const course = videoCourses[meta.course] || { name: meta.courseName || "视频教程", url: "" };
        let href = meta.url || "";
        let rangeText = meta.display || "";
        if (!href && course.url) {
          const parts = String(meta.range || "").split("-");
          const startPart = Number(parts[0]) || 1;
          const endPart = Number(parts[1] || parts[0]) || startPart;
          href = `${course.url}?p=${startPart}`;
          if (!rangeText) rangeText = startPart === endPart ? `第 ${startPart} 集` : `第 ${startPart}-${endPart} 集`;
        }
        const topic = meta.topic || meta.title || "";
        return `<a class="video-link" href="${href}" target="_blank" rel="noopener" title="${course.name} ${rangeText} ${topic}">
          <span class="video-link-course">${course.name}</span>
          <span class="video-link-range">${rangeText}</span>
          <span class="video-link-topic">${topic}</span>
          <span class="video-link-open">打开</span>
        </a>`;
      }).join("")}</div>`;
    }

    function plannedMinutes(hours) {
      return Math.round(parseFloat(hours) * 60) || 0;
    }

    function loadSkills() {
      const saved = JSON.parse(localStorage.getItem(SKILLS_KEY) || "{}");
      return skillPlan.map(item => ({ ...item, done: !!saved[item.id] }));
    }

    function persistSkills() {
      const snapshot = {};
      skills.forEach(item => snapshot[item.id] = !!item.done);
      localStorage.setItem(SKILLS_KEY, JSON.stringify(snapshot));
    }

    function getDayProgress(item) {
      const total = 2 + item.actions.length + item.questions.length;
      const done = Number(item.videoDone) + Number(item.goalDone) +
        item.actionsDone.filter(Boolean).length +
        item.answers.filter(answer => answer.answered || answer.answer.trim()).length;
      return { done, total, percent: Math.round((done / total) * 100) };
    }

    function renderReviewPanel() {
      const flagged = [];
      state.forEach(item => {
        item.answers.forEach((answer, index) => {
          if (answer.review) flagged.push({ item, index, answer });
        });
      });
      reviewCount.textContent = flagged.length;
      if (!flagged.length) {
        reviewPanel.classList.add("hidden");
        reviewPanel.innerHTML = "";
        return;
      }
      reviewPanel.classList.remove("hidden");
      reviewPanel.innerHTML = `
        <h2>复习队列（${flagged.length}）</h2>
        <div class="review-list">
          ${flagged.map(({ item, answer, index }) => `
            <div class="review-item">
              <div>
                <p>${escapeHtml(answer.text)}</p>
                <small>${item.date} · ${item.video}</small>
              </div>
              <button type="button" data-open-date="${item.date}">打开</button>
            </div>`).join("")}
        </div>`;
      reviewPanel.querySelectorAll("[data-open-date]").forEach(button => {
        button.addEventListener("click", () => openItem(button.dataset.openDate));
      });
    }

    function renderHeatmap() {
      heatmapPanel.innerHTML = `
        <h2>学习热力图</h2>
        <div class="heatmap">
          ${state.map(item => {
            const progress = getDayProgress(item);
            const level = progress.percent === 0 ? "" : progress.percent < 50 ? "low" : progress.percent < 100 ? "mid" : "full";
            return `<button class="heat-cell ${level}" data-date="${item.date}" title="${item.date} · ${progress.done}/${progress.total} · ${progress.percent}%"></button>`;
          }).join("")}
        </div>`;
      heatmapPanel.querySelectorAll(".heat-cell").forEach(cell => {
        cell.addEventListener("click", () => openItem(cell.dataset.date));
      });
    }

      const doneCount = skills.filter(item => item.done).length;
      skillProgress.textContent = `${doneCount}/${skillPlan.length} 已掌握`;
      skillList.innerHTML = skillPlan.map(item => `
        <div class="skill-item">
          <input type="checkbox" data-skill="${item.id}" ${item.done ? "checked" : ""}>
          <label>${item.name}</label>
        </div>`).join("");
      skillList.querySelectorAll("input[type='checkbox']").forEach(input => {
        input.addEventListener("change", () => {
          const skill = skills.find(item => item.id === input.dataset.skill);
          if (skill) skill.done = input.checked;
          persistSkills();
          renderSummary();
          renderSkills();
        });
      });
    }

    function openItem(date) {
      const item = state.find(entry => entry.date === date);
      if (!item) return;
      item.open = true;
      persist();
      render();
      const card = document.querySelector(`.day-card[data-date="${date}"]`);
      if (card) card.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function renderSummary() {
      const videoDone = state.filter(item => item.videoDone).length;
      const goalDone = state.filter(item => item.goalDone).length;
      const actionTotal = state.reduce((sum, item) => sum + item.actions.length, 0);
      const actionDone = state.reduce((sum, item) => sum + item.actionsDone.filter(Boolean).length, 0);
      const questionTotal = state.reduce((sum, item) => sum + item.questions.length, 0);
      const questionDone = state.reduce((sum, item) => sum + item.answers.filter(answer => answer.answered || answer.answer.trim()).length, 0);
      const totalItems = state.length * 2 + actionTotal + questionTotal;
      const totalDone = videoDone + goalDone + actionDone + questionDone;
      const percent = totalItems ? Math.round((totalDone / totalItems) * 100) : 0;
      const reviewTotal = state.reduce((sum, item) => sum + item.answers.filter(answer => answer.review).length, 0);
      const actualMinutes = state.reduce((sum, item) => sum + (Number(item.actualMinutes) || 0), 0);
      const plannedMinutesTotal = state.reduce((sum, item) => sum + plannedMinutes(item.hours), 0);
      const skillDone = skills.filter(item => item.done).length;
      let streak = 0;
      for (const item of state) {
        if (isComplete(item)) streak += 1;
        else break;
      }

      summary.innerHTML = `
        <div class="metric"><strong>${percent}%</strong><span>总进度</span></div>
        <div class="metric"><strong>${videoDone}/${state.length}</strong><span>视频任务</span></div>
        <div class="metric"><strong>${goalDone}/${state.length}</strong><span>学习目标</span></div>
        <div class="metric"><strong>${actionDone}/${actionTotal}</strong><span>当日动作</span></div>
        <div class="metric"><strong>${questionDone}/${questionTotal}</strong><span>必答问题</span></div>
        <div class="metric"><strong>${reviewTotal}</strong><span>待复习</span></div>
        <div class="metric"><strong>${actualMinutes}/${plannedMinutesTotal}</strong><span>实际/计划分钟</span></div>
        <div class="metric"><strong>${streak}</strong><span>连续完成</span></div>
        <div class="metric"><strong>${skillDone}/${skillPlan.length}</strong><span>核心能力</span></div>`;
    }

    function getStatus(item) {
      const total = 2 + item.actions.length + item.questions.length;
      const done = Number(item.videoDone) + Number(item.goalDone) +
        item.actionsDone.filter(Boolean).length +
        item.answers.filter(answer => answer.answered || answer.answer.trim()).length;
      if (done === 0) return "todo";
      if (done === total) return "done";
      return "doing";
    }

    function isComplete(item) {
      return getStatus(item) === "done";
    }


    function navigateDay(offset) {
      if (!state.length) return;
      let index = state.findIndex(item => item.date === getTodayDateKey());
      if (index < 0) index = state.findIndex(item => item.open);
      if (index < 0) index = 0;
      const target = (index + offset + state.length) % state.length;
      openItem(state[target].date);
    }

    function getTodayDateKey() {
      const now = new Date();
      return `${now.getMonth() + 1}/${now.getDate()}`;
    }

    function isNextDay(item) {
      return item.date === getTodayDateKey();
    }

    function setAllOpen(open) {
      state.forEach(item => item.open = open);
      persist();
      render();
    }

    function exportState() {
      const blob = new Blob([JSON.stringify({ days: state, skills: skills }, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "机器人开发工具学习进度.json";
      link.click();
      URL.revokeObjectURL(url);
    }

    function importState(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const incoming = JSON.parse(reader.result);
          const dayItems = Array.isArray(incoming) ? incoming : incoming.days;
          if (!Array.isArray(dayItems)) throw new Error("缺少学习日数据");
          const snapshot = {};
          dayItems.forEach(item => {
            snapshot[item.date] = {
              open: item.open !== false,
              videoDone: !!item.videoDone,
              goalDone: !!item.goalDone,
              actualMinutes: Number(item.actualMinutes) || 0,
              notes: item.notes || "",
              actionsDone: item.actionsDone || [],
              answers: item.answers.map(answer => ({ answer: answer.answer || "", answered: !!answer.answered, review: !!answer.review }))
            };
          });
          localStorage.setItem(STORAGE_KEY, JSON.stringify(snapshot));
          if (!Array.isArray(incoming) && Array.isArray(incoming.skills)) {
            const skillSnapshot = {};
            incoming.skills.forEach(item => skillSnapshot[item.id] = !!item.done);
            localStorage.setItem(SKILLS_KEY, JSON.stringify(skillSnapshot));
          }
          location.reload();
        } catch (error) {
          alert("导入失败：文件格式不正确。");
        }
      };
      reader.readAsText(file);
      event.target.value = "";
    }

    function resetState() {
      if (!confirm("确定清空全部勾选、问题回答和复习记录吗？")) return;
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem(SKILLS_KEY);
      location.reload();
    }

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
